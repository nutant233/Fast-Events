mod_description=Dispatch-path optimizations for NeoForge.EVENT_BUS on Minecraft 1.21.1.\nEvery listener invocation on the NeoForge bus goes through a generated, fully inlined dispatcher instead of a megamorphic loop, and event objects are not even constructed when nobody listens to that event class.
