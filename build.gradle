plugins {
    id 'java-library'
}

group = 'io.github.nutant'
version = '1.18-26.10.1'

base {
    archivesName = 'fastevents'
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}


repositories {
    mavenCentral()
    maven { url = 'https://maven.minecraftforge.net/' }
}

// 全部 compileOnly：这些类在启动器/游戏运行时都已经存在，jar 里不能打包它们
dependencies {
    compileOnly 'net.minecraftforge:eventbus:5.0.3'
    compileOnly('net.minecraftforge:forgespi:4.0.15-4.x') { transitive = false }
    compileOnly 'cpw.mods:modlauncher:9.1.3'
    compileOnly 'org.ow2.asm:asm:9.7.1'
    compileOnly 'org.ow2.asm:asm-tree:9.7.1'
    compileOnly 'org.ow2.asm:asm-analysis:9.7.1'
    compileOnly 'org.apache.logging.log4j:log4j-api:2.17.1'
    compileOnly 'net.jodah:typetools:0.6.3'
}

jar {
    manifest {
        attributes(
                'Specification-Title': 'FastEvents',
                'Specification-Version': project.version,
                'Implementation-Title': 'fastevents',
                'Implementation-Version': project.version,
                'Sealed': 'true'
        )
    }
}

// 离线验证：不依赖 MC，直接跑 tools/build.ps1 里的同一套编译 + harness
tasks.register('harness', Exec) {
    group = 'verification'
    commandLine 'powershell', '-NoProfile', '-ExecutionPolicy', 'Bypass',
            '-File', file('tools/build.ps1').absolutePath
}
